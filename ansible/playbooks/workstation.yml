---
- name: Configure workstation
  hosts: all
  become: false

  pre_tasks:
    - name: Show deployment target
      ansible.builtin.debug:
        msg: "Deploying to {{ inventory_hostname }} ({{ ansible_host | default(inventory_hostname) }})"
      tags: [always]

  roles:
    - role: common
      tags: [common]
    - role: git_config
      tags: [git]
    - role: podman
      tags: [podman]
    - role: nftables
      tags: [nftables, router]
    - role: router
      tags: [router]
    - role: shell_config
      tags: [shell]
    - role: ssh_hardening
      tags: [ssh]
    - role: system_scripts
      tags: [scripts]
    - role: systemd
      tags: [systemd]
    - role: sane_airscan
      tags: [scanner]
    - role: vscode
      tags: [vscode]
    - role: yakuake
      tags: [yakuake]
