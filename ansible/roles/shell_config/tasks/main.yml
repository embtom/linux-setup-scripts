---
- name: Install fish shell and shell tools
  ansible.builtin.apt:
    name:
      - fish
      - direnv
      - fzf
      - lsd
      - starship
      - unzip
      - fontconfig
    state: present
  become: true

- name: Prefer Debian libxml2 over bchemet repository
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/90-bchemet-libxml2
    mode: "0644"
    content: |
      Package: libxml2
      Pin: release o=Debian
      Pin-Priority: 1001
  become: true

- name: Reconcile libxml2 with Debian package version
  ansible.builtin.apt:
    name: libxml2
    state: latest
    update_cache: true
    allow_downgrade: true
  become: true

- name: Install pyenv dependencies
  ansible.builtin.apt:
    name:
      - make
      - build-essential
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - libncursesw5-dev
      - xz-utils
      - tk-dev
      - libxml2-dev
      - libxmlsec1-dev
      - libffi-dev
      - liblzma-dev
    state: present
  become: true

- name: Install pyenv
  ansible.builtin.git:
    repo: https://github.com/pyenv/pyenv.git
    dest: "{{ home_dir }}/.pyenv"
    version: master
    update: false

- name: Install pyenv-virtualenv plugin
  ansible.builtin.git:
    repo: https://github.com/pyenv/pyenv-virtualenv.git
    dest: "{{ home_dir }}/.pyenv/plugins/pyenv-virtualenv"
    version: master
    update: false

- name: Ensure fish config directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config/fish"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy config.fish
  ansible.builtin.copy:
    src: config.fish
    dest: "{{ home_dir }}/.config/fish/config.fish"
    owner: "{{ ansible_user }}"
    mode: "0644"

- name: Ensure fish completions directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config/fish/completions"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy podman-compose fish completions
  ansible.builtin.copy:
    src: podman-compose.fish
    dest: "{{ home_dir }}/.config/fish/completions/podman-compose.fish"
    owner: "{{ ansible_user }}"
    mode: "0644"

- name: Deploy starship gruvbox-rainbow preset
  ansible.builtin.command:
    cmd: starship preset gruvbox-rainbow -o {{ home_dir }}/.config/starship.toml
    creates: "{{ home_dir }}/.config/starship.toml"

- name: Remove existing hostname configuration from starship preset
  ansible.builtin.replace:
    path: "{{ home_dir }}/.config/starship.toml"
    regexp: '^\[hostname\]\n(?:.*\n)*?(?=^\[|\Z)'
  tags: [starship]

- name: Remove legacy managed hostname markers
  ansible.builtin.replace:
    path: "{{ home_dir }}/.config/starship.toml"
    regexp: '^# (?:BEGIN|END) ANSIBLE MANAGED - hostname\n'
  tags: [starship]

- name: Remove existing username configuration from starship preset
  ansible.builtin.replace:
    path: "{{ home_dir }}/.config/starship.toml"
    regexp: '^\[username\]\n(?:.*\n)*?(?=^\[|\Z)'
  tags: [starship]

- name: Configure hostname and username in starship prompt
  ansible.builtin.blockinfile:
    path: "{{ home_dir }}/.config/starship.toml"
    insertbefore: '^\[directory\]$'
    marker: '# {mark} ANSIBLE MANAGED - identity'
    block: |
      [hostname]
      ssh_only = false
      format = '[ $hostname ](bg:color_orange fg:color_fg0)'
      disabled = false

      [username]
      show_always = true
      style_user = "bg:color_orange fg:color_fg0"
      style_root = "bg:color_orange fg:color_fg0"
      format = '[ $user ]($style)'
  tags: [starship]

- name: Remove legacy managed directory blocks
  ansible.builtin.replace:
    path: "{{ home_dir }}/.config/starship.toml"
    regexp: '^(?:# BEGIN ANSIBLE MANAGED - directory\n)?\[directory\]\n(?:[^\n]*\n)*?# END ANSIBLE MANAGED - directory\n'
  tags: [starship]

- name: Remove existing directory configuration from starship preset
  ansible.builtin.replace:
    path: "{{ home_dir }}/.config/starship.toml"
    regexp: '^\[directory\]\n(?:[^\n]*\n)*?(?=^\[|\Z)'
  tags: [starship]

- name: Configure directory color in starship prompt
  ansible.builtin.blockinfile:
    path: "{{ home_dir }}/.config/starship.toml"
    insertbefore: '^\[git_branch\]$'
    marker: '# {mark} ANSIBLE MANAGED - directory'
    block: |
      [directory]
      style = "fg:color_fg0 bg:color_yellow"
      format = "[ $path ]($style)"
      truncation_length = 3
      truncation_symbol = "…/"
  tags: [starship]

- name: Remove OS module from starship format
  ansible.builtin.lineinfile:
    path: "{{ home_dir }}/.config/starship.toml"
    regexp: '^\$os\\$'
    state: absent
  tags: [starship]

- name: Remove existing hostname module from starship format
  ansible.builtin.lineinfile:
    path: "{{ home_dir }}/.config/starship.toml"
    regexp: '^\$hostname\\$'
    state: absent
  tags: [starship]

- name: Add hostname before username in starship format
  ansible.builtin.lineinfile:
    path: "{{ home_dir }}/.config/starship.toml"
    insertbefore: '\$username\\'
    line: '$hostname\'
  tags: [starship]

- name: Ensure fish is listed in /etc/shells
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: /usr/bin/fish
    create: false
  become: true

- name: Set fish as default shell for user (LDAP/SSSD compatible)
  ansible.builtin.command:
    cmd: chsh -s /usr/bin/fish
  register: shell_config_chsh_result
  changed_when: shell_config_chsh_result.rc == 0
  failed_when: shell_config_chsh_result.rc != 0
  become: true

- name: Ensure user fonts directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.local/share/fonts/NerdFonts"
    state: directory
    mode: "0755"

- name: Download Nerd Font
  vars:
    nerd_font_url: >
      https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Hack.zip
  ansible.builtin.get_url:
    url: "{{ nerd_font_url }}"
    dest: /tmp/Hack.zip
    mode: "0644"

- name: Extract Hack Nerd Font
  ansible.builtin.unarchive:
    src: /tmp/Hack.zip
    dest: "{{ home_dir }}/.local/share/fonts/NerdFonts"
    remote_src: true
    creates: "{{ home_dir }}/.local/share/fonts/NerdFonts/HackNerdFont-Regular.ttf"

- name: Refresh font cache
  ansible.builtin.command:
    cmd: fc-cache -f "{{ home_dir }}/.local/share/fonts"
  changed_when: true

- name: Check if KDE Konsole is installed
  ansible.builtin.stat:
    path: /usr/bin/konsole
  register: shell_config_konsole_binary

- name: Configure Konsole
  when: shell_config_konsole_binary.stat.exists
  block:
    - name: Ensure Konsole profiles directory exists
      ansible.builtin.file:
        path: "{{ home_dir }}/.local/share/konsole"
        state: directory
        mode: "0755"

    - name: Deploy Konsole profile with Hack Nerd Font
      ansible.builtin.copy:
        src: fish-shell.profile
        dest: "{{ home_dir }}/.local/share/konsole/fish-shell.profile"
        mode: "0644"

    - name: Set Konsole default profile
      ansible.builtin.lineinfile:
        path: "{{ home_dir }}/.config/konsolerc"
        regexp: '^DefaultProfile='
        line: 'DefaultProfile=fish-shell.profile'
        insertafter: '^\[Desktop Entry\]'
        create: true
        mode: "0644"
