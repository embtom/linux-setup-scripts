- name: Install nftables
  ansible.builtin.apt:
    name:
      - nftables
    state: present
    update_cache: true
  become: true

- name: Ensure nftables rules directory exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Configure nftables base configuration
  ansible.builtin.copy:
    content: |
      #!/usr/sbin/nft -f

      flush ruleset

      include "/etc/nftables.d/*.nft"
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart nftables

- name: Configure nftables input filter
  ansible.builtin.template:
    src: 10-filter.nft.j2
    dest: /etc/nftables.d/10-filter.nft
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart nftables

- name: Validate assembled nftables configuration
  ansible.builtin.command:
    cmd: /usr/sbin/nft -c -f /etc/nftables.conf
  become: true
  changed_when: false

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Disable firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: false
    state: stopped
  become: true
  when: ansible_facts.services['firewalld.service'] is defined

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
  become: true
