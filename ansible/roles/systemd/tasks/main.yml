---
- name: Install systemd-resolved
  ansible.builtin.apt:
    name: systemd-resolved
    state: present
  become: true

- name: Remove Avahi mDNS daemon
  ansible.builtin.apt:
    name: avahi-daemon
    state: absent
    purge: true
  become: true

- name: Remove NSS mDNS module
  ansible.builtin.apt:
    name: libnss-mdns
    state: absent
    purge: true
  become: true

- name: Use systemd-resolved for local hostname resolution
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    regexp: '^(hosts:\s+.*)\s+mdns4_minimal\s+\[NOTFOUND=return\](.*)$'
    line: '\1\2'
    backrefs: true
  become: true

- name: Deploy systemd-resolved configuration
  ansible.builtin.copy:
    src: resolved.conf
    dest: /etc/systemd/resolved.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart DNS services in order

- name: Ensure systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Enable Multicast DNS after vendor drop-ins
  ansible.builtin.copy:
    content: |
      [Resolve]
      MulticastDNS=yes
    dest: /etc/systemd/resolved.conf.d/90-multicast-dns.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart DNS services in order

- name: Enable and start systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: true
    state: started
  become: true

- name: Ensure /etc/resolv.conf points to systemd-resolved stub
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  become: true

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Configure NetworkManager to use systemd-resolved
  when: ansible_facts.services['NetworkManager.service'] is defined
  block:
    - name: Ensure NetworkManager conf.d directory exists
      ansible.builtin.file:
        path: /etc/NetworkManager/conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Deploy NetworkManager DNS config
      ansible.builtin.copy:
        src: NetworkManager-dns.conf
        dest: /etc/NetworkManager/conf.d/dns.conf
        owner: root
        group: root
        mode: "0644"
      become: true
      notify: Restart DNS services in order
